<!doctype html>
<html lang="en">
  <head>
    <title>We're sorry, but something went wrong (500 Server error)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <!-- Served as it is, with the app possibly down: all it needs is in here. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f5f7fb;
        color: #0f1626;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main { width: 100%; max-width: 28rem; text-align: center; }

      .mark {
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto 1.5rem;
        padding: 0.6rem;
        border-radius: 14px;
        background: #1a4fef;
        color: #fff;
      }

      .code {
        display: inline-block;
        margin-bottom: 0.75rem;
        padding: 0.15rem 0.7rem;
        border-radius: 999px;
        background: #dbe7ff;
        color: #143fd0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      h1 { font-size: 1.625rem; line-height: 1.25; letter-spacing: -0.015em; }
      p { margin-top: 0.75rem; color: #4c576b; }

      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.6rem 1.1rem;
        border-radius: 6px;
        background: #1a4fef;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover { background: #143fd0; }
      a:focus-visible { outline: 2px solid #5a8bff; outline-offset: 2px; }

      @media (prefers-color-scheme: dark) {
        body { background: #0a101f; color: #e8ecf5; }
        .code { background: rgba(47, 102, 255, 0.2); color: #8fb3ff; }
        p { color: #a6b1c7; }
        a { background: #2f66ff; }
        a:hover { background: #4a7bff; }
      }
    </style>
  </head>

  <body>
    <main>
      <svg class="mark" viewBox="72 72 368 368" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M176 186v140"/>
        <path d="M336 234c0 62-62 78-124 78h-36"/>
        <circle cx="176" cy="142" r="44"/>
        <circle cx="176" cy="370" r="44"/>
        <circle cx="336" cy="190" r="44"/>
      </svg>
      <div class="code">500 · Server error</div>
      <h1>Something went wrong on the server.</h1>
      <p>It is not you. Try again in a moment. If you run this server, the logs have more.</p>
      <a href="/">Back to gitito</a>
    </main>
  </body>
</html>
